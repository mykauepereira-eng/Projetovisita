<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4C63D">
<title>Operação Visita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna de app; abas no topo; tarefas viram baralhos de flash cards com cara de esponja (amarelo + faixa verde) */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --sunken:#E7EBE4; --ink:#1C2820; --muted:#5D6B62; --line:#D7DED4;
  --sponge:#F4C63D; --sponge-pore:#DDA91D; --sponge-ink:#2A2208; --scrub:#2D6A45; --scrub-ink:#FFFFFF;
  --p-kaue:#2B67C9; --p-mariah:#B8336F; --p-ayron:#C9661A; --warn-bg:#FFF1E6; --warn-ink:#8A3B0A;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111813; --surface:#1A241D; --sunken:#151D17; --ink:#E8EEE7; --muted:#9BAAA0; --line:#2A382F;
  --sponge:#F0C447; --sponge-pore:#C9971A; --sponge-ink:#231C05; --scrub:#62B582; --scrub-ink:#0D1610;
  --p-kaue:#7FA8F0; --p-mariah:#EE80B0; --p-ayron:#F0A35E; --warn-bg:#2E1E12; --warn-ink:#F6BE92; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111813; --surface:#1A241D; --sunken:#151D17; --ink:#E8EEE7; --muted:#9BAAA0; --line:#2A382F;
  --sponge:#F0C447; --sponge-pore:#C9971A; --sponge-ink:#231C05; --scrub:#62B582; --scrub-ink:#0D1610;
  --p-kaue:#7FA8F0; --p-mariah:#EE80B0; --p-ayron:#F0A35E; --warn-bg:#2E1E12; --warn-ink:#F6BE92; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--scrub);outline-offset:2px}
.app{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 72px;display:flex;flex-direction:column;gap:20px}

.top{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--scrub)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,56px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.top p{margin:0;color:var(--muted);max-width:60ch}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}

h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:18px;margin:0}
.muted{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:12px}

/* sponge texture */
.sponge{background-color:var(--sponge);background-image:radial-gradient(circle at 30% 40%,var(--sponge-pore) 1.6px,transparent 2.2px),radial-gradient(circle at 70% 70%,var(--sponge-pore) 1.1px,transparent 1.8px);background-size:14px 14px,10px 10px;color:var(--sponge-ink)}

.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn-main{box-shadow:inset 0 -5px 0 var(--scrub)}
.btn-main:active{transform:translateY(1px)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.rules li{max-width:65ch}

.draw-table{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.draw-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.draw-row:first-child{border-top:0}
.draw-row .tname{font-weight:600;min-width:0}
.draw-row .tsub{font-size:13px;color:var(--muted)}
.slot{font-family:var(--display);font-weight:700;font-size:18px;min-width:84px;text-align:right}
.slot.rolling{opacity:.55}
.slot.settled{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}

.code-box{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.code-box input{width:120px;font:700 22px/1 var(--display);letter-spacing:.2em;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--sunken);color:var(--ink)}
.code-pill{display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;font-weight:600;flex-wrap:wrap}
.code-pill b{font-family:var(--display);font-size:26px;letter-spacing:.15em}

.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.people{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left}
.pcard-head{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;color:var(--surface);flex:0 0 auto}
.pcard .who{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
.pcard .mins{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunken);border:1px solid var(--line)}
.bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--scrub);border-radius:99px;transition:width .3s}

.phases{display:flex;flex-direction:column;gap:0}
.phase{display:grid;grid-template-columns:44px 1fr;gap:14px;padding-bottom:18px;position:relative}
.phase:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.phase-n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.phase-body{display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:4px}
.phase-body p{margin:0;color:var(--muted);font-size:14px}

.tasks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.tasks{grid-template-columns:1fr}}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden}
.task:hover{border-color:var(--muted)}
.task .stripe{height:12px;border-bottom:4px solid var(--scrub)}
.task .inner{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.task .room{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.task strong{font-family:var(--display);font-size:21px;line-height:1.15}
.task .meta{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.task .open{font-weight:700;color:var(--scrub)}
.task.done .stripe{background:var(--scrub);background-image:none}

.person-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.person-head .avatar{width:56px;height:56px;font-size:26px}
.person-head .txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

.room-group{display:flex;flex-direction:column;gap:10px}
.room-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.room-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.room-item:first-child{border-top:0}
.room-item .l{display:flex;flex-direction:column;min-width:0}
.room-item .l span{font-size:13px;color:var(--muted)}
.tagname{font-weight:700;display:flex;align-items:center;gap:6px;flex:0 0 auto}

.warnbox{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:500}

/* deck */
.deck{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.deck-wrap{flex:1;display:flex;flex-direction:column;gap:14px;width:100%;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px;min-height:0}
.deck-top{display:flex;align-items:center;gap:12px}
.deck-top .t{flex:1;min-width:0}
.deck-top .t b{font-family:var(--display);font-size:19px;display:block;line-height:1.15}
.deck-top .t span{font-size:13px;color:var(--muted)}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;flex:0 0 auto}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{flex:1 1 10px;min-width:8px;height:6px;border-radius:99px;background:var(--line)}
.dots i.ok{background:var(--scrub)}
.dots i.cur{background:var(--sponge-pore)}
.fcard{flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.fcard .top-band{height:30px;border-bottom:6px solid var(--scrub);flex:0 0 auto}
.fcard .content{padding:22px 22px 24px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.fcard .stepno{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fcard h2{font-size:clamp(28px,6vw,38px);letter-spacing:-.01em}
.fcard p{margin:0;font-size:18px;line-height:1.55;max-width:60ch}
.tip{background:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.tip b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--scrub);margin-bottom:2px}
.fcard .checked{font-size:14px;font-weight:700;color:var(--scrub)}
.deck-ctrl{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.deck-ctrl .btn{width:100%}
.finish{align-items:flex-start;justify-content:center}
.swipe-hint{font-size:12px;color:var(--muted);text-align:center}
.fade-in{animation:fin .25s ease-out}
@keyframes fin{from{opacity:.4;transform:translateX(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <span class="eyebrow">Hoje à noite tem visita</span>
    <h1>Operação Visita</h1>
    <p>Manual da faxina pra quem acha que a louça se lava sozinha. Kauê, Mariah e Ayron: larguem o celular. Quer dizer, usem o celular só pra ler isto aqui.</p>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>

<div class="deck" id="deck" hidden>
  <div class="deck-wrap" id="deckWrap"></div>
</div>

<script>
(function(){
const PEOPLE={kaue:{name:"Kauê",c:"var(--p-kaue)"},mariah:{name:"Mariah",c:"var(--p-mariah)"},ayron:{name:"Ayron",c:"var(--p-ayron)"}};
const ORDER=["kaue","mariah","ayron"];
const ROOMS={cozinha:"Cozinha",sala:"Sala",banheiro:"Banheiro",casa:"Casa toda"};
const PHASES=[
  {n:1,t:"Tirar a bagunça",s:"Antes de limpar, alguém tira as coisas do caminho. Ninguém limpa em cima de bagunça."},
  {n:2,t:"Limpeza pesada",s:"Todo mundo ao mesmo tempo, cada um no seu canto. Sem ficar olhando o outro trabalhar."},
  {n:3,t:"Chão",s:"Sempre por último. Se varrer antes, alguém sacode uma almofada e suja tudo de novo."},
  {n:4,t:"Toque final",s:"Os três juntos, uns 15 minutos. É o que faz a diferença quando ela entrar."}
];

const TASKS=[
{id:"organizar",name:"Organizar os itens pela casa",room:"casa",min:30,phase:1,steps:[
 {t:"Você começa primeiro",b:"Seu trabalho vem antes de todo mundo, porque ninguém consegue limpar em cima de bagunça. Começa já, enquanto os outros ainda estão procurando a vassoura."},
 {t:"Pega um cesto grande",b:"Um cesto, caixa ou sacola grande. Ele vai ser seu carrinho de coisas fora do lugar."},
 {t:"Passa cômodo por cômodo",b:"Entra em cada cômodo e recolhe tudo que não pertence a ele. Não arruma ainda, só recolhe. Começa pela entrada da casa: é a primeira coisa que ela vê."},
 {t:"Roupa",b:"Roupa suja vai pro cesto de roupa. Roupa limpa vai dobrada pro armário. Nada pendurado em cadeira, porta ou sofá. Toalha molhada vai pro varal, não pra cama."},
 {t:"Sapatos",b:"Todos em par, perto da porta ou na sapateira. Os que sobrarem vão pro quarto do dono. Chinelo de cabeça pra baixo no meio da sala não existe mais."},
 {t:"Coisas pequenas",b:"Carregador, chave, papel, carta, boné, fone. Cada um no seu lugar. Não sabe qual é o lugar? Uma gaveta ou caixa só pra isso, fechada.",d:"Boleto, remédio e papel de escola não ficam à vista. Gaveta."},
 {t:"Quartos",b:"Pelo menos os que dá pra ver do corredor: cama arrumada, lençol esticado, travesseiro no lugar, porta do armário fechada. Os outros quartos: porta fechada e pronto."},
 {t:"Lixo da casa toda",b:"Esvazia todas as lixeiras (menos a do banheiro, que é de quem pegou o banheiro), junta tudo num saco só e leva pra fora de casa. Coloca saco novo em cada lixeira."},
 {t:"Entrada da casa",b:"Tapete da porta sacudido, nada empilhado na entrada, cabideiro sem dez casacos. A primeira impressão acontece aqui, nos primeiros 3 segundos."},
 {t:"Esvazia o cesto",b:"Volta pelos cômodos devolvendo cada coisa do cesto pro lugar dela. Regra: o cesto termina vazio. Não vale jogar tudo num quarto e fechar a porta. (Tá, vale um quarto. Só um.)"},
 {t:"Avisa quem pegou o chão",b:"Terminou um cômodo e ele está sem nada no chão? Avisa quem vai varrer que ali já está liberado."}
]},
{id:"lavar",name:"Lavar a louça",room:"cozinha",min:35,phase:2,fixed:"mariah",steps:[
 {t:"Larga o celular",b:"Coloca ele longe da pia. Molhado ele não funciona e com ele na mão você não lava nada. Prende o cabelo e arregaça a manga."},
 {t:"Junta toda a louça da casa",b:"Passa no quarto, na sala, na mesa. Copo atrás do computador também conta. Traz tudo pra perto da pia antes de começar, senão vai ter que começar de novo depois."},
 {t:"Raspa os restos no lixo",b:"Com um garfo ou guardanapo, joga a comida no lixo. Não na pia. Ralo entupido hoje à noite é a última coisa que alguém precisa.",d:"Panela com coisa grudada: enche com água quente e uma gota de detergente e deixa de molho enquanto você lava o resto."},
 {t:"Separa por tipo",b:"Faz montinhos: copos, talheres, pratos, potes, panelas. Parece frescura, mas assim a água fica limpa por mais tempo e você termina mais rápido."},
 {t:"Prepara a esponja",b:"Esponja molhada e um pouco de detergente. Um pouco é do tamanho de uma moeda, não meio frasco. Espuma demais só dá mais trabalho pra enxaguar.",d:"Lado amarelo: tudo. Lado verde (o áspero): só panela. Lado verde em copo deixa risco pra sempre."},
 {t:"Copos primeiro",b:"Copo é o que suja menos, então vai primeiro. Esfrega por dentro, por fora e principalmente a borda, que é onde a boca encosta. Contra a luz não pode ter marca de dedo nem de gordura."},
 {t:"Talheres",b:"Um por um. Garfo: entre os dentes. Faca: segura pelo cabo e passa a esponja com o corte virado pra longe da mão."},
 {t:"Pratos e potes",b:"Frente E verso. Atrás do prato também suja, porque ele fica empilhado em cima de outro. Pote de plástico: os cantos e a tampa, onde a gordura se esconde."},
 {t:"Panelas por último",b:"A que estava de molho agora sai fácil. Lado verde da esponja. Por fora e no fundo também.",d:"Frigideira antiaderente (a preta por dentro): só o lado amarelo."},
 {t:"Enxágua direito",b:"Água corrente até sumir toda a espuma. Teste: passa o dedo. Se ranger, está limpo. Se escorregar, ainda tem sabão. Volta e enxágua."},
 {t:"Escorredor",b:"Copos de boca pra baixo, pratos em pé, talheres de cabo pra baixo no porta-talher. Não empilha coisa molhada uma dentro da outra, senão não seca nunca."},
 {t:"Limpa a pia",b:"Esponja com detergente na cuba inteira, na torneira e na borda. Tira a sujeira do ralo e joga no lixo. Enxágua. Torce a esponja e deixa ela secando de pé."}
]},
{id:"secar",name:"Secar a louça",room:"cozinha",min:20,phase:2,lottery:true,steps:[
 {t:"Espera ter uma pilha",b:"Não precisa ficar parado olhando a Mariah lavar. Começa quando o escorredor estiver cheio. Enquanto isso, ajuda a juntar os copos espalhados pela casa."},
 {t:"Pega um pano limpo",b:"Pano de prato seco e limpo. Cheira ele. Se tem cheiro de cachorro molhado, vai pro cesto de roupa e você pega outro. Pano fedido deixa a louça fedida.",d:"Lava as mãos antes. Mão suja em louça limpa desfaz o trabalho de outra pessoa."},
 {t:"Copos",b:"Segura pelo fundo, enfia o pano dentro e gira. Depois por fora. Olha contra a luz: se ficou mancha de água, passa de novo."},
 {t:"Talheres",b:"Um por vez, segurando pelo cabo. Faca com o corte virado pra longe. Não junta um bolo de talheres no pano pra esfregar tudo junto: um deles vai te cortar."},
 {t:"Pratos",b:"Frente e verso, inclusive a borda. Prato seco vai direto pra pilha do armário."},
 {t:"Panelas e potes",b:"Por dentro, por fora, alça e tampa. Pote de plástico demora pra secar, então deixa ele de boca pra baixo uns minutos e passa o pano de novo."},
 {t:"Troca o pano",b:"Quando o pano estiver encharcado, ele só espalha água. Pega outro seco. Pode usar dois, ninguém vai cobrar."},
 {t:"Guarda no lugar certo",b:"Cada coisa volta pro armário dela. Não sabe onde vai? Abre os armários e procura onde estão os iguais. Proibido esconder louça no forno ou no micro-ondas."},
 {t:"Separa a louça da noite",b:"Escolhe os 2 copos (ou taças) e os 2 pratos mais bonitos, sem lascado. Seca muito bem e deixa separado num canto limpo pra quem vai arrumar a mesa."},
 {t:"Fecha o serviço",b:"Escorredor vazio e seco, bancada da pia sem poça d'água, pano usado no cesto de roupa. Pronto."}
]},
{id:"sala",name:"Arrumar a sala",room:"sala",min:30,phase:2,steps:[
 {t:"Abre as janelas",b:"Primeira coisa. Sala fechada tem cheiro de sala fechada, e você não sente porque se acostumou. Ela vai sentir na hora."},
 {t:"Pega um saco de lixo",b:"E passa por tudo: embalagem, papel, lata, palito, guardanapo, nota fiscal. Embaixo do sofá também. Sim, tem que agachar."},
 {t:"Tira o que não é da sala",b:"Roupa, mochila, tênis, carregador, copo, prato. Louça vai pra Mariah na cozinha. O resto vai pro dono ou pro cesto de quem está organizando a casa."},
 {t:"Desmonta o sofá",b:"Tira todas as almofadas. Sacode cada uma. Passa a mão ou um pano no assento e nos cantos: vai sair migalha, moeda e coisa que você prefere não saber o que é. Lixo."},
 {t:"Monta o sofá de volta",b:"Almofadas do assento no lugar, retas. Almofadas pequenas em pé, encostadas, todas viradas pro mesmo lado. Manta dobrada em quatro em cima do braço do sofá."},

/* ---------- sorteio justo e reproduzível ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function computeAssign(seed){
  const r=mulberry32(seed);
  const dryer=r()<0.5?"kaue":"ayron";
  const rest=["organizar","sala","banheiro","mesa","chao"];
  const ok=[];
  for(let n=0;n<243;n++){
    let x=n; const a={lavar:"mariah",secar:dryer};
    for(const t of rest){a[t]=ORDER[x%3];x=Math.floor(x/3);}
    const load={kaue:0,mariah:0,ayron:0},cnt={kaue:0,mariah:0,ayron:0};
    for(const t in a){load[a[t]]+=BY[t].min;cnt[a[t]]++;}
    if(Math.min(cnt.kaue,cnt.mariah,cnt.ayron)<2) continue;
    const v=[load.kaue,load.mariah,load.ayron];
    if(Math.max(...v)-Math.min(...v)<=10) ok.push(a);
  }
  return ok[Math.floor(r()*ok.length)];
}
function assign(){return S.seed?computeAssign(S.seed):null;}
function tasksOf(p,A){return TASKS.filter(t=>(A?A[t.id]:(t.fixed||null))===p);}
function doneArr(id){return S.done[id]||[];}
function pct(list){let tot=0,d=0;list.forEach(t=>{tot+=t.steps.length;d+=doneArr(t.id).length;});return tot?Math.round(d/tot*100):0;}
function mins(list){return list.reduce((s,t)=>s+t.min,0);}

function taskCard(t,A){
  const d=doneArr(t.id).length, n=t.steps.length, full=d>=n;
  const who=t.all?"Os três juntos":(A&&A[t.id]?PEOPLE[A[t.id]].name:(t.fixed?PEOPLE[t.fixed].name:"Sorteio"));
  return `<button class="task${full?" done":""}" data-open="${t.id}">
    <span class="stripe sponge"></span>
    <span class="inner">
      <span class="room">${ROOMS[t.room]} · fase ${t.phase}</span>
      <strong>${t.name}</strong>
      <span class="meta"><span>${n} passos · uns ${t.min} min · ${who}</span><span class="open">${full?"Feito ✓":d?"Continuar →":"Abrir cards →"}</span></span>
      <span class="bar"><i style="width:${Math.round(d/n*100)}%"></i></span>
    </span></button>`;
}

/* ---------- animação do sorteio ---------- */
function startDraw(){
  const seed=1000+Math.floor(Math.random()*9000);
  const A=computeAssign(seed);
  rolling=true; render();
  const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const order=["secar","organizar","sala","banheiro","mesa","chao"];
  const settled={lavar:true};
  const pool={secar:["kaue","ayron"]};
  const iv=setInterval(()=>{
    order.forEach(id=>{ if(settled[id]) return; const el=document.querySelector(`[data-slot="${id}"]`); if(!el) return;
      const opts=pool[id]||ORDER; const p=opts[Math.floor(Math.random()*opts.length)];
      el.textContent=PEOPLE[p].name; el.style.color=PEOPLE[p].c; el.className="slot rolling";});
  },70);
  const base=reduce?100:900, step=reduce?60:450;
  order.forEach((id,i)=>setTimeout(()=>{
    settled[id]=true; const el=document.querySelector(`[data-slot="${id}"]`);
    if(el){el.textContent=PEOPLE[A[id]].name;el.style.color=PEOPLE[A[id]].c;el.className="slot settled";}
    if(i===order.length-1){ clearInterval(iv);
      setTimeout(()=>{S.seed=seed;S.done={};save();rolling=false;render();},reduce?50:1100);}
  },base+i*step));
}

/* ---------- baralho de flash cards ---------- */
let deck={id:null,i:0,fin:false};
const FIN_MSG=["Pronto. Viu? Ninguém morreu.","Acabou. Pode voltar a respirar.","Feito. A visita agradece, mesmo sem saber.","Terminou. Agora vai ver se alguém precisa de ajuda."];
function openDeck(id){
  const t=BY[id]; const d=doneArr(id);
  let i=0; while(i<t.steps.length&&d.includes(i)) i++;
  deck={id,i:Math.min(i,t.steps.length-1),fin:i>=t.steps.length};
  $("#deck").hidden=false; document.body.style.overflow="hidden"; renderDeck();
}
function closeDeck(){$("#deck").hidden=true;document.body.style.overflow="";render();}
function renderDeck(){
  const t=BY[deck.id], A=assign(), n=t.steps.length, d=doneArr(t.id);
  const who=t.all?"Os três juntos":(A?PEOPLE[A[t.id]].name:(t.fixed?PEOPLE[t.fixed].name:"Ainda não sorteado"));
  const dots=t.steps.map((_,k)=>`<i class="${d.includes(k)?"ok":""}${!deck.fin&&k===deck.i?" cur":""}"></i>`).join("");
  let card,ctrl;
  if(deck.fin){
    card=`<div class="fcard"><div class="top-band sponge"></div><div class="content finish fade-in"><span class="stepno">${n} de ${n} passos</span><h2>${FIN_MSG[Math.floor(Math.random()*FIN_MSG.length)]}</h2><p>${t.name}: concluído.</p></div></div>`;
    ctrl=`<button class="btn btn-ghost" id="dRestart">Rever do início</button><button class="btn btn-main sponge" id="dClose2">Voltar pra lista</button>`;
  }else{
    const s=t.steps[deck.i];
    card=`<div class="fcard" id="fcard"><div class="top-band sponge"></div><div class="content fade-in">
      <span class="stepno">Passo ${deck.i+1} de ${n}</span>
      <h2>${s.t}</h2><p>${s.b}</p>
      ${s.d?`<div class="tip"><b>Presta atenção</b>${s.d}</div>`:""}
      ${d.includes(deck.i)?`<span class="checked">✓ Já marcado como feito</span>`:""}
    </div></div>`;
    ctrl=`<button class="btn btn-ghost" id="dPrev" ${deck.i===0?"disabled":""}>← Voltar</button><button class="btn btn-main sponge" id="dNext">${deck.i===n-1?"Feito, terminei":"Feito, próximo →"}</button>`;
  }
  $("#deckWrap").innerHTML=`<div class="deck-top"><div class="t"><b>${t.name}</b><span>${who} · ${ROOMS[t.room]}</span></div><button class="x" id="dClose" aria-label="Fechar">×</button></div>
    <div class="dots" aria-hidden="true">${dots}</div>${card}<div class="deck-ctrl">${ctrl}</div><div class="swipe-hint">Dá pra arrastar o card pro lado</div>`;
}
function next(){ if(deck.fin) return; const t=BY[deck.id]; const d=doneArr(t.id);
  if(!d.includes(deck.i)){d.push(deck.i);S.done[t.id]=d;save();}
  if(deck.i<t.steps.length-1) deck.i++; else deck.fin=true; renderDeck();}
function prev(){ if(deck.fin){deck.fin=false;deck.i=BY[deck.id].steps.length-1;} else if(deck.i>0) deck.i--; renderDeck();}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]"); if(v){view=v.dataset.view;confirmReset=false;codeErr="";S.me=PEOPLE[view]?view:S.me;save();render();window.scrollTo(0,0);return;}
  const o=e.target.closest("[data-open]"); if(o){openDeck(o.dataset.open);return;}
  const id=e.target.closest("button")&&e.target.closest("button").id;
  if(id==="drawBtn") startDraw();
  else if(id==="codeBtn"){const v2=($("#codeIn").value||"").trim(); if(/^\d{4}$/.test(v2)&&+v2>=1000){S.seed=+v2;S.done={};codeErr="";save();render();} else {codeErr="O código tem 4 números, tipo 4821. Confere no outro celular.";render();}}
  else if(id==="resetBtn"){confirmReset=true;render();}
  else if(id==="resetNo"){confirmReset=false;render();}
  else if(id==="resetYes"){S.seed=null;S.done={};confirmReset=false;save();render();}
  else if(id==="dClose"||id==="dClose2") closeDeck();
  else if(id==="dNext") next();
  else if(id==="dPrev") prev();
  else if(id==="dRestart"){delete S.done[deck.id];save();deck.fin=false;deck.i=0;renderDeck();}
});
document.addEventListener("keydown",e=>{
  if($("#deck").hidden) return;
  if(e.key==="ArrowRight") next(); else if(e.key==="ArrowLeft") prev(); else if(e.key==="Escape") closeDeck();
});
let tx=null,ty=null;
$("#deck").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
$("#deck").addEventListener("touchend",e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ if(dx<0) next(); else prev(); }},{passive:true});

if(S.seed&&S.me&&PEOPLE[S.me]) view=S.me;
render();
})();
</script>

</body>
</html>
