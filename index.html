<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4C63D">
<title>Operação Visita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna de app; abas no topo; tarefas viram baralhos de flash cards com cara de esponja (amarelo + faixa verde) */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --sunken:#E7EBE4; --ink:#1C2820; --muted:#5D6B62; --line:#D7DED4;
  --sponge:#F4C63D; --sponge-pore:#DDA91D; --sponge-ink:#2A2208; --scrub:#2D6A45; --scrub-ink:#FFFFFF;
  --p-kaue:#2B67C9; --p-mariah:#B8336F; --p-ayron:#C9661A; --warn-bg:#FFF1E6; --warn-ink:#8A3B0A;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111813; --surface:#1A241D; --sunken:#151D17; --ink:#E8EEE7; --muted:#9BAAA0; --line:#2A382F;
  --sponge:#F0C447; --sponge-pore:#C9971A; --sponge-ink:#231C05; --scrub:#62B582; --scrub-ink:#0D1610;
  --p-kaue:#7FA8F0; --p-mariah:#EE80B0; --p-ayron:#F0A35E; --warn-bg:#2E1E12; --warn-ink:#F6BE92; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111813; --surface:#1A241D; --sunken:#151D17; --ink:#E8EEE7; --muted:#9BAAA0; --line:#2A382F;
  --sponge:#F0C447; --sponge-pore:#C9971A; --sponge-ink:#231C05; --scrub:#62B582; --scrub-ink:#0D1610;
  --p-kaue:#7FA8F0; --p-mariah:#EE80B0; --p-ayron:#F0A35E; --warn-bg:#2E1E12; --warn-ink:#F6BE92; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--scrub);outline-offset:2px}
.app{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 72px;display:flex;flex-direction:column;gap:20px}

.top{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--scrub)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,56px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.top p{margin:0;color:var(--muted);max-width:60ch}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}

h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:18px;margin:0}
.muted{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:12px}

/* sponge texture */
.sponge{background-color:var(--sponge);background-image:radial-gradient(circle at 30% 40%,var(--sponge-pore) 1.6px,transparent 2.2px),radial-gradient(circle at 70% 70%,var(--sponge-pore) 1.1px,transparent 1.8px);background-size:14px 14px,10px 10px;color:var(--sponge-ink)}

.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn-main{box-shadow:inset 0 -5px 0 var(--scrub)}
.btn-main:active{transform:translateY(1px)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.rules li{max-width:65ch}

.draw-table{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.draw-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.draw-row:first-child{border-top:0}
.draw-row .tname{font-weight:600;min-width:0}
.draw-row .tsub{font-size:13px;color:var(--muted)}
.slot{font-family:var(--display);font-weight:700;font-size:18px;min-width:84px;text-align:right}
.slot.rolling{opacity:.55}
.slot.settled{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}

.code-box{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.code-box input{width:120px;font:700 22px/1 var(--display);letter-spacing:.2em;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--sunken);color:var(--ink)}
.code-pill{display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;font-weight:600;flex-wrap:wrap}
.code-pill b{font-family:var(--display);font-size:26px;letter-spacing:.15em}

.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.people{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left}
.pcard-head{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;color:var(--surface);flex:0 0 auto}
.pcard .who{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
.pcard .mins{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunken);border:1px solid var(--line)}
.bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--scrub);border-radius:99px;transition:width .3s}

.phases{display:flex;flex-direction:column;gap:0}
.phase{display:grid;grid-template-columns:44px 1fr;gap:14px;padding-bottom:18px;position:relative}
.phase:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.phase-n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.phase-body{display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:4px}
.phase-body p{margin:0;color:var(--muted);font-size:14px}

.tasks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.tasks{grid-template-columns:1fr}}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden}
.task:hover{border-color:var(--muted)}
.task .stripe{height:12px;border-bottom:4px solid var(--scrub)}
.task .inner{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.task .room{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.task strong{font-family:var(--display);font-size:21px;line-height:1.15}
.task .meta{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.task .open{font-weight:700;color:var(--scrub)}
.task.done .stripe{background:var(--scrub);background-image:none}

.person-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.person-head .avatar{width:56px;height:56px;font-size:26px}
.person-head .txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

.room-group{display:flex;flex-direction:column;gap:10px}
.room-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.room-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.room-item:first-child{border-top:0}
.room-item .l{display:flex;flex-direction:column;min-width:0}
.room-item .l span{font-size:13px;color:var(--muted)}
.tagname{font-weight:700;display:flex;align-items:center;gap:6px;flex:0 0 auto}

.warnbox{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:500}

/* deck */
.deck{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.deck-wrap{flex:1;display:flex;flex-direction:column;gap:14px;width:100%;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px;min-height:0}
.deck-top{display:flex;align-items:center;gap:12px}
.deck-top .t{flex:1;min-width:0}
.deck-top .t b{font-family:var(--display);font-size:19px;display:block;line-height:1.15}
.deck-top .t span{font-size:13px;color:var(--muted)}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;flex:0 0 auto}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{flex:1 1 10px;min-width:8px;height:6px;border-radius:99px;background:var(--line)}
.dots i.ok{background:var(--scrub)}
.dots i.cur{background:var(--sponge-pore)}
.fcard{flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.fcard .top-band{height:30px;border-bottom:6px solid var(--scrub);flex:0 0 auto}
.fcard .content{padding:22px 22px 24px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.fcard .stepno{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fcard h2{font-size:clamp(28px,6vw,38px);letter-spacing:-.01em}
.fcard p{margin:0;font-size:18px;line-height:1.55;max-width:60ch}
.tip{background:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.tip b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--scrub);margin-bottom:2px}
.fcard .checked{font-size:14px;font-weight:700;color:var(--scrub)}
.deck-ctrl{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.deck-ctrl .btn{width:100%}
.finish{align-items:flex-start;justify-content:center}
.swipe-hint{font-size:12px;color:var(--muted);text-align:center}
.fade-in{animation:fin .25s ease-out}
@keyframes fin{from{opacity:.4;transform:translateX(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- gamificação ---------- */
.tabmoney{font-size:12px;font-weight:700;opacity:.75;font-variant-numeric:tabular-nums}
.news{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:var(--r);border:2px solid var(--scrub);background:var(--surface);margin-bottom:20px}
.newbadge{flex:0 0 auto;font-family:var(--display);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.08em;padding:6px 10px;border-radius:10px;box-shadow:inset 0 -3px 0 var(--scrub)}
.newsbody{display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-width:0}
.newsbody p{margin:0;max-width:62ch}
.pmoney{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--scrub)}
.pmoney small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted)}
.wallet{border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 -8px 0 var(--scrub)}
.wlabel{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.amt{font-family:var(--display);font-weight:800;font-size:clamp(46px,12vw,72px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.amt.bump{animation:bump .5s ease-out}
@keyframes bump{30%{transform:scale(1.08)}}
.wsub{font-weight:600;font-size:14px}
.wbar{height:12px;border-radius:99px;background:rgba(42,34,8,.15);overflow:hidden;margin-bottom:6px}
.wbar i{display:block;height:100%;background:var(--sponge-ink);border-radius:99px}
.wlvl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px}
.lvl{font-weight:800;background:var(--sponge-ink);color:var(--sponge);padding:5px 10px;border-radius:999px;font-size:13px}
.taskrow,.steprow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.valtag,.cardval{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cardval{font-size:14px;padding:6px 12px}
.valtag.team,.cardval.team{background:var(--scrub);color:var(--scrub-ink)}
.bonusnote{font-weight:700;color:var(--scrub);font-size:15px}
.wchip{font-family:var(--display);font-weight:800;padding:8px 12px;border-radius:12px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.chest,.chest-big{background:var(--surface);border:2px dashed var(--sponge-pore);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.chest-big{flex-direction:row;align-items:center;gap:16px}
.chest-head{display:flex;align-items:center;gap:14px}
.chest-ico{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:32px;flex:0 0 auto;box-shadow:inset 0 -6px 0 var(--scrub);animation:wiggle 3.5s ease-in-out infinite}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-8deg)}92%{transform:rotate(7deg)}95%{transform:rotate(-4deg)}}
.teasers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.teasers li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--sunken);border:1px solid var(--line)}
.teasers .lk{flex:0 0 auto;min-width:48px;text-align:center;font-weight:800;font-size:13px;padding:4px 8px;border-radius:8px;background:var(--line);font-variant-numeric:tabular-nums}
.teasers li.locked span:last-child{color:var(--muted);filter:blur(.3px)}
.teasers li.open{border-color:var(--scrub)}
.teasers li.open .lk{background:var(--scrub);color:var(--scrub-ink)}
.teasers li.open span:last-child{font-weight:700}
.approved{border:2px solid var(--scrub);position:relative;overflow:hidden}
.stamp{align-self:flex-start;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--scrub);border:3px solid var(--scrub);border-radius:8px;padding:4px 10px;transform:rotate(-4deg)}
.floater{position:fixed;left:50%;top:38%;z-index:70;pointer-events:none;font-family:var(--display);font-weight:800;font-size:40px;color:var(--scrub);background:var(--surface);padding:6px 16px;border-radius:14px;border:2px solid var(--scrub);font-variant-numeric:tabular-nums;white-space:nowrap;animation:floatup 1.2s ease-out forwards}
.floater.big{font-size:32px;top:30%;color:var(--sponge-ink);background:var(--sponge);border-color:var(--sponge-pore)}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,16px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}
.confetto{position:fixed;top:-16px;width:9px;height:15px;z-index:65;border-radius:2px;pointer-events:none;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(620deg)}}
@media (max-width:560px){.chest-big{flex-direction:column;align-items:flex-start}.news{flex-direction:column}}

.fine{margin:0;font-size:12px;color:var(--muted)}
.receipt{background:var(--sunken);border:1px dashed var(--line);border-radius:6px;padding:14px;font-family:ui-monospace,"Courier New",monospace;font-size:13px;display:flex;flex-direction:column;gap:6px}
.rhead{font-weight:800;letter-spacing:.06em;border-bottom:1px dashed var(--line);padding-bottom:8px}
.rrow{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.rrow span{min-width:0}
.rrow b{white-space:nowrap}
.rrow.total{border-top:1px dashed var(--line);padding-top:6px;font-size:14px}
.rfoot{border-top:1px dashed var(--line);padding-top:8px;color:var(--muted);font-family:var(--body)}
.saquemsg{font-weight:700;color:var(--warn-ink);min-height:1.5em}

.wheel-wrap{position:relative;width:min(320px,100%);margin:6px auto 0;aspect-ratio:1;max-width:100%}
.wheel-wrap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}
.wheel{transform-origin:0 0}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--warn-ink);z-index:2}
.spin-ctrl{display:flex;justify-content:center}
.spin-result{text-align:center;display:flex;flex-direction:column;gap:4px;min-height:1px}
.spin-result b{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,44px);color:var(--warn-ink);letter-spacing:-.01em}
.spin-result.show{animation:shake .6s ease-out}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.votemsg{font-weight:700;min-height:1.5em}
.vale{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.vale-title{font-size:clamp(40px,11vw,60px);color:var(--scrub);letter-spacing:-.02em;transform:rotate(-2deg);align-self:flex-start}
.ticket{position:relative;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 -6px 0 var(--scrub);
  -webkit-mask:radial-gradient(circle 10px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 10px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
.t-eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.t-big{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1;border-bottom:2px dashed var(--sponge-ink);padding-bottom:10px}
.t-row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.t-row b{text-align:right}
.vale-cta{margin:0;font-weight:800;font-size:17px;color:var(--warn-ink)}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <span class="eyebrow">Hoje à noite tem visita</span>
    <h1>Operação Visita</h1>
    <p>Manual da faxina pra quem acha que a louça se lava sozinha. Kauê, Mariah e Ayron: larguem o celular. Quer dizer, usem o celular só pra ler isto aqui.</p>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>

<div class="deck" id="deck" hidden>
  <div class="deck-wrap" id="deckWrap"></div>
</div>

<script>
(function(){

/* ---------- dinheiro (ajuste aqui) ---------- */
const VALOR_POR_MINUTO=0.20;   // R$ por minuto de serviço da tarefa
const BONUS_TAREFA=1.00;       // R$ extra quando termina uma tarefa inteira
const PIN_HASH=2090616753;     // senha da vistoria do Tio Pira

function cents(v){return Math.round(v*100);}
function potC(t){return cents(t.min*VALOR_POR_MINUTO);}
function stepC(t,k){const n=t.steps.length,p=potC(t),b=Math.floor(p/n);return k===n-1?p-b*(n-1):b;}
function brl(c,pre){return (pre||"R$")+" "+(c/100).toFixed(2).replace(".",",");}
function cur(p){return S.approved[p]?"P$":"R$";}
function doneArr(id){return S.done[id]||[];}
function isFull(t){return doneArr(t.id).length>=t.steps.length;}
function earnedTask(t){return doneArr(t.id).reduce((s,k)=>s+stepC(t,k),0)+(isFull(t)?cents(BONUS_TAREFA):0);}
function maxTask(t){return potC(t)+cents(BONUS_TAREFA);}
function tasksOf(p){return TASKS.filter(t=>FIXED[t.id]===p);}
function earned(p){return tasksOf(p).reduce((s,t)=>s+earnedTask(t),0);}
function maxOf(p){return tasksOf(p).reduce((s,t)=>s+maxTask(t),0);}
function pct(list){let tot=0,d=0;list.forEach(t=>{tot+=t.steps.length;d+=doneArr(t.id).length;});return tot?Math.round(d/tot*100):0;}
function mins(list){return list.reduce((s,t)=>s+t.min,0);}
function hash(s){let x=5381;for(const c of s)x=((x<<5)+x+c.charCodeAt(0))>>>0;return x;}

const LEVELS=[[0,"Imundo do sofá"],[15,"Sujinho em recuperação"],[40,"Aprendiz de esponja"],[70,"Faxineiro de respeito"],[100,"Lenda da vassoura"]];
function level(pc){let i=0;LEVELS.forEach((l,k)=>{if(pc>=l[0])i=k;});return {i,name:LEVELS[i][1],next:LEVELS[i+1]};}

const $=s=>document.querySelector(s);
function avatar(p){return `<span class="avatar" style="background:${PEOPLE[p].c}">${PEOPLE[p].name[0]}</span>`;}
function nameTag(p){const P=PEOPLE[p];return `<span class="tagname"><span class="dot" style="background:${P.c}"></span>${P.name}</span>`;}

function renderTabs(){
  const items=[["plano","Plano"],...ORDER.map(p=>[p,PEOPLE[p].name]),["comodos","Por cômodo"]];
  $("#tabs").innerHTML=items.map(([id,l])=>`<button class="tab" role="tab" id="tab-${id}" aria-selected="${view===id}" data-view="${id}">${PEOPLE[id]?`<span class="dot" style="background:${PEOPLE[id].c}"></span>`:""}${l}${PEOPLE[id]?` <span class="tabmoney">${brl(earned(id),cur(id))}</span>`:""}</button>`).join("");
}

function taskCard(t){
  const d=doneArr(t.id).length, n=t.steps.length, full=d>=n;
  const who=t.all?"Os três juntos":PEOPLE[FIXED[t.id]].name;
  const val=t.all?`<span class="valtag team">Libera o lanche</span>`:`<span class="valtag sponge">${full?"Ganhou "+brl(earnedTask(t)):"Vale até "+brl(maxTask(t))}</span>`;
  return `<button class="task${full?" done":""}" data-open="${t.id}">
    <span class="stripe sponge"></span>
    <span class="inner">
      <span class="taskrow"><span class="room">${ROOMS[t.room]} · fase ${t.phase}</span>${val}</span>
      <strong>${t.name}</strong>
      <span class="meta"><span>${n} cards · uns ${t.min} min · ${who}</span><span class="open">${full?"Feito ✓":d?"Continuar →":"Abrir cards →"}</span></span>
      <span class="bar"><i style="width:${Math.round(d/n*100)}%"></i></span>
    </span></button>`;
}

/* ---------- roleta (100% de chance de dar ruim) ---------- */
const LOSE_W=16;
const SLICES=[["VIRA PIRA-REAL","var(--ink)","var(--bg)",true],["FICA COM TUDO","var(--sponge)","var(--sponge-ink)"],["DOBRO!","var(--scrub)","var(--scrub-ink)"],["FICA COM TUDO","var(--p-kaue)","var(--surface)"],["TRIPLO!","var(--sponge)","var(--sponge-ink)"],["FICA COM TUDO","var(--p-mariah)","var(--surface)"],["DOBRO!","var(--scrub)","var(--scrub-ink)"],["FICA COM TUDO","var(--p-ayron)","var(--surface)"]];
function wheelSVG(){
  const big=(360-LOSE_W)/(SLICES.length-1); let a=0, out="";
  const pt=(deg,r)=>{const t=deg*Math.PI/180;return [(r*Math.sin(t)).toFixed(2),(-r*Math.cos(t)).toFixed(2)];};
  SLICES.forEach(([label,bg,fg,lose])=>{const w=lose?LOSE_W:big, b=a+w, [x1,y1]=pt(a,100), [x2,y2]=pt(b,100), mid=a+w/2;
    out+=`<path d="M0 0 L${x1} ${y1} A100 100 0 ${w>180?1:0} 1 ${x2} ${y2} Z" fill="${bg}" stroke="var(--surface)" stroke-width="1.5"/>`;
    out+=`<text transform="rotate(${mid.toFixed(2)}) translate(0,-56) rotate(-90)" text-anchor="middle" dominant-baseline="central" fill="${fg}" font-size="${lose?7:9.5}" font-weight="800" font-family="var(--display)">${label}</text>`;
    a=b;});
  return `<svg viewBox="-104 -104 208 208" role="img" aria-label="Roleta da Sorte"><g id="wheel" class="wheel">${out}</g><circle r="16" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/><text text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="800" fill="var(--ink)" font-family="var(--display)">P$</text></svg>`;
}
function roulettePanel(p){
  const name=PEOPLE[p].name;
  return `<div class="panel approved roulette"><span class="stamp">Aprovado</span>
    <h3>Vistoria aprovada! Agora, a Roleta da Sorte.</h3>
    <p style="margin:0">Pela lei do PiraBank, todo saque passa pela roleta. ${name} tem <b>${brl(earned(p))}</b> na conta. Pode ficar com tudo, dobrar ou até triplicar. Tem uma fatia pequenininha que ninguém nunca tira.</p>
    <div class="wheel-wrap"><span class="pointer" aria-hidden="true"></span>${wheelSVG()}</div>
    <div class="spin-result" id="spinRes" aria-live="polite"></div>
    <div class="spin-ctrl"><button class="btn btn-main sponge" id="spin" data-p="${p}">Girar a roleta</button></div></div>`;
}
function sad(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const now=actx.currentTime;
  [392,370,349,294].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t0=now+i*0.38,len=i===3?1.1:0.34;o.type="sawtooth";o.frequency.value=f;
    if(i===3){o.frequency.setValueAtTime(f,t0);o.frequency.linearRampToValueAtTime(f*0.94,t0+len);}
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.09,t0+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t0+len);
    o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+len+0.05);});}catch(e){}}

function ding(big){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const now=actx.currentTime;

    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.16,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.28);

function confetti(){ if(reduce) return; const cols=["var(--sponge)","var(--scrub)","var(--p-kaue)","var(--p-mariah)","var(--p-ayron)"];
  for(let k=0;k<50;k++){const i=document.createElement("i");i.className="confetto";i.style.left=Math.random()*100+"vw";i.style.background=cols[k%cols.length];
    i.style.animationDelay=(Math.random()*0.4)+"s";i.style.animationDuration=(1.2+Math.random()*0.9)+"s";document.body.appendChild(i);setTimeout(()=>i.remove(),2600);}}

let deck={id:null,i:0,fin:false};
const FIN_MSG=["Pronto. Viu? Ninguém morreu.","Acabou. E ainda ganhou dinheiro.","Feito. A visita agradece, mesmo sem saber.","Terminou. Agora vai ver se alguém precisa de ajuda."];
function openDeck(id){

function next(){ if(deck.fin) return; const t=BY[deck.id]; const d=doneArr(t.id); const owner=t.all?null:FIXED[t.id];

  else if(id==="verExtrato"){render();}
  else if(id==="votar"){const pp=b.dataset.p, m=$("#voteMsg"); b.disabled=true;
    const steps=["Registrando seu voto…","Votos pra excluir o site: 1 de 3…","Contando os votos…","Votação encerrada. Resultado:"];
    steps.forEach((t,i)=>setTimeout(()=>{m.textContent=t; if(i<3) ding(false);},reduce?i*60:i*900));
    setTimeout(()=>{S.vale[pp]=true;save();const box=$("#valeBox");if(box){box.innerHTML=valeTicket(pp);} ding(true); confetti();},reduce?260:3700);}
  else if(id==="saque"){const m=$("#saqueMsg");b.disabled=true;m.textContent="Processando saque…";
    setTimeout(()=>{m.textContent=SAQUE[saqueN%SAQUE.length];saqueN++;b.disabled=false;b.textContent="Tentar sacar de novo";},reduce?50:1400);}
  else if(id==="dClose"||id==="dClose2") closeDeck();
  else if(id==="dNext") next();
  else if(id==="dPrev") prev();
  else if(id==="dRestart"){deck.fin=false;deck.i=0;renderDeck();}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target&&e.target.id==="pinIn"){const b=$("#pinOk");if(b)b.click();return;}
  if($("#deck").hidden) return;
  if(e.key==="ArrowRight") next(); else if(e.key==="ArrowLeft") prev(); else if(e.key==="Escape") closeDeck();
});
let tx=null,ty=null;
$("#deck").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
$("#deck").addEventListener("touchend",e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ if(dx<0) next(); else prev(); }},{passive:true});

if(S.me&&PEOPLE[S.me]) view=S.me;
render();
})();
</script>

</body>
</html>
